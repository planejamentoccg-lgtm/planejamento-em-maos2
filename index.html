<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Planejamento em Mãos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.imgur.com/NphFuB6.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/NphFuB6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/iZ8gr1i.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131F1D">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#F2F1EA;
      --paper:#0B120F;
      --paper-2:#12201C;
      --line:#33443F;
      --accent:#8FB84B;
      --accent-bright:#A8D666;
      --text-soft:#93A49C;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--ink);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .cartao {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      height: 40px;
      width: auto;
      background: #FFFFFF;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 28px;
    }
    .icone {
      width: 56px;
      height: 56px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--paper-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icone svg {
      width: 26px;
      height: 26px;
      color: var(--accent-bright);
    }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0 0 14px;
      color: var(--ink);
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-soft);
      margin: 0;
    }
    .rodape {
      margin-top: 32px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="cartao">
    <img class="logo" src="https://i.imgur.com/iZ8gr1i.png" alt="Consórcio Construtor Gávea">

    <div class="icone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3.5 2"/>
      </svg>
    </div>

    <div class="eyebrow">Planejamento em Mãos</div>
    <h1>Em atualização de cronograma</h1>
    <p>Estamos ajustando os dados do cronograma. Em breve o app estará de volta ao normal.</p>

    <div class="rodape">Consórcio Construtor Gávea</div>
  </div>
</body>
</html>
